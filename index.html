<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR Perfis · Tarefas</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0c;--dark:#111115;--surface:#18181e;--border:#2a2a35;--yellow:#FFD600;--blue:#00C2FF;--white:#f0f0f5;--muted:#888899;--red:#ff4455;--green:#00e0a0;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:"Inter",sans-serif;min-height:100vh;overflow-x:hidden}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;padding:24px}
.login-logo{height:100px;width:auto;max-width:200px;border-radius:12px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(255,214,0,.2))}
.login-title{font-family:"Rajdhani",sans-serif;font-size:28px;font-weight:700;letter-spacing:3px;color:var(--blue);text-align:center}
.login-sub{font-size:13px;color:var(--muted);text-align:center}
.btn-google{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 28px;cursor:pointer;font-family:"Rajdhani",sans-serif;font-size:16px;font-weight:700;letter-spacing:1.5px;color:var(--white);text-transform:uppercase;transition:all .2s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.btn-google:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 4px 24px rgba(0,194,255,.2)}
.btn-google svg{width:22px;height:22px;flex-shrink:0}
.login-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.green{background:var(--green)}
.dot.yellow{background:var(--yellow);animation:blink 1s infinite}
.dot.red{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* HEADER */
header{background:var(--dark);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.6)}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{height:44px;width:auto;max-width:80px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(255,214,0,.15))}
.logo-text{font-family:"Rajdhani",sans-serif;font-size:20px;font-weight:700;letter-spacing:2px;color:var(--blue);text-shadow:0 0 12px #00C2FF66}
.header-sub{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:8px}
.sync-info{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.header-date{font-family:"Rajdhani",sans-serif;font-size:13px;color:var(--yellow);white-space:nowrap}
.user-chip{display:flex;align-items:center;gap:6px}
.user-photo{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);object-fit:cover;display:none}
.user-name{font-size:12px;color:var(--muted);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-sm{border:1px solid var(--border);background:transparent;border-radius:7px;font-family:"Rajdhani",sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;cursor:pointer;color:var(--muted);transition:all .2s;white-space:nowrap}
.btn-sm:hover{border-color:var(--yellow);color:var(--yellow);background:rgba(255,214,0,.05)}
.btn-sm.danger:hover{border-color:var(--red);color:var(--red);background:rgba(255,68,85,.05)}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:28px 20px 60px}

/* FORM */
.add-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.add-card h2{font-family:"Rajdhani",sans-serif;font-size:16px;font-weight:600;letter-spacing:2px;color:var(--yellow);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.add-card h2::before{content:"";display:inline-block;width:3px;height:16px;background:var(--yellow);border-radius:2px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input[type=date],select,textarea{background:var(--dark);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:"Inter",sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s;-webkit-appearance:none}
input[type=text]{flex:1;min-width:200px}
input[type=date]{width:150px;color-scheme:dark}
select{width:140px;cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,194,255,.15)}
input::placeholder,textarea::placeholder{color:var(--muted)}
::-webkit-calendar-picker-indicator{filter:invert(.6)}
.prazo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prazo-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:var(--muted)}
.toggle-sw{position:relative;width:36px;height:20px}
.toggle-sw input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:background .2s;cursor:pointer}
.toggle-slider::before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:transform .2s,background .2s}
.toggle-sw input:checked+.toggle-slider{background:rgba(0,194,255,.25);border:1px solid var(--blue)}
.toggle-sw input:checked+.toggle-slider::before{transform:translateX(16px);background:var(--blue)}
.prazo-field{display:none;align-items:center;gap:6px}
.prazo-field.show{display:flex}
.btn{border:none;border-radius:8px;font-family:"Rajdhani",sans-serif;font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 22px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--yellow);color:var(--black);box-shadow:0 4px 16px rgba(255,214,0,.25)}
.btn-primary:hover{box-shadow:0 6px 24px rgba(255,214,0,.4);opacity:.92}

/* TABS */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;font-family:"Rajdhani",sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;padding:8px 16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--blue);color:var(--blue)}
.tab.active{background:var(--blue);border-color:var(--blue);color:var(--black);box-shadow:0 0 16px rgba(0,194,255,.3)}
.tab .badge{background:rgba(0,0,0,.25);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.section-title{font-family:"Rajdhani",sans-serif;font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.tasks-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.5}

/* CARD */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s,box-shadow .2s,opacity .2s;animation:slideIn .25s ease;position:relative}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.task-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:1;border-radius:var(--radius) 0 0 var(--radius)}
.task-card[data-priority=alta]::before{background:var(--red)}
.task-card[data-priority=media]::before{background:var(--yellow)}
.task-card[data-priority=baixa]::before{background:var(--green)}
.task-card:hover{border-color:#3a3a48;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.task-card.done{opacity:.55}
.task-card.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-top{padding:14px 18px;display:flex;align-items:flex-start;gap:14px}
.chk{width:22px;height:22px;min-width:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px;background:transparent;flex-shrink:0}
.chk:hover{border-color:var(--blue)}
.chk.checked{background:var(--blue);border-color:var(--blue);box-shadow:0 0 10px rgba(0,194,255,.4)}
.chk.checked::after{content:"✓";color:var(--black);font-size:13px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:500;color:var(--white);word-break:break-word;line-height:1.4}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.tag{font-family:"Rajdhani",sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:4px;flex-shrink:0}
.tag-cat{background:rgba(0,194,255,.12);color:var(--blue);border:1px solid rgba(0,194,255,.2)}
.tag-alta{background:rgba(255,68,85,.12);color:var(--red);border:1px solid rgba(255,68,85,.2)}
.tag-media{background:rgba(255,214,0,.12);color:var(--yellow);border:1px solid rgba(255,214,0,.2)}
.tag-baixa{background:rgba(0,224,160,.12);color:var(--green);border:1px solid rgba(0,224,160,.2)}
.tag-solic{background:rgba(180,130,255,.12);color:#c49dff;border:1px solid rgba(180,130,255,.25)}
.task-date{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-shrink:0}
.task-date.overdue{color:var(--red)}
.task-actions{display:flex;gap:6px;align-items:flex-start;flex-shrink:0}
.act-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.act-btn.del:hover{border-color:var(--red);color:var(--red);background:rgba(255,68,85,.08)}

/* DROPDOWN */
.dd-wrap{position:relative;display:inline-block;flex-shrink:0}
.dd-tag{cursor:pointer;user-select:none;transition:opacity .15s}
.dd-tag:hover{opacity:.8}
.dd-tag::after{content:" ▾";font-size:9px;opacity:.7}
.dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.7);min-width:130px;flex-direction:column;gap:2px}
.dd-menu.open{display:flex}
.dd-item{font-family:"Rajdhani",sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;border-radius:6px;cursor:pointer;border:none;background:transparent;text-align:left;transition:background .15s;width:100%}
.dd-item:hover{background:rgba(255,255,255,.07)}
.dd-item.cur{opacity:.4;cursor:default}
.dd-item.cat{color:var(--blue)}
.dd-item.alta{color:var(--red)}
.dd-item.media{color:var(--yellow)}
.dd-item.baixa{color:var(--green)}

/* OBS */
.obs-section{border-top:1px solid var(--border);padding:8px 18px 10px}
.obs-add-btn{background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;padding:1px 0;transition:color .2s;font-family:"Inter",sans-serif}
.obs-add-btn:hover{color:var(--blue)}
.obs-chip{display:inline-flex;align-items:flex-start;gap:8px;max-width:70%;background:rgba(0,194,255,.06);border:1px solid rgba(0,194,255,.14);border-radius:8px;padding:6px 10px;cursor:pointer;transition:background .15s}
.obs-chip:hover{background:rgba(0,194,255,.1)}
.obs-chip-icon{font-size:11px;color:var(--blue);flex-shrink:0;margin-top:1px}
.obs-chip-label{font-family:"Rajdhani",sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.obs-chip-text{font-size:12px;color:#b8b8cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;display:block}
.obs-chip-hint{font-size:9px;color:var(--muted);display:block;margin-top:1px}
.obs-editor{display:none}
.obs-editor.open{display:block}
.obs-editor-label{font-family:"Rajdhani",sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.obs-ta{width:100%;resize:vertical;min-height:68px;font-size:13px;line-height:1.5;border-radius:8px;padding:9px 12px;background:var(--dark);border:1px solid var(--border);color:var(--white);font-family:"Inter",sans-serif;transition:border-color .2s}
.obs-ta:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px rgba(0,194,255,.12)}
.obs-ta::placeholder{color:var(--muted);font-style:italic}
.obs-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.obs-saved{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s}
.obs-saved.show{opacity:1}
.obs-close{background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted);font-family:"Inter",sans-serif;transition:color .2s;padding:0}
.obs-close:hover{color:var(--white)}

/* STATS */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;min-width:80px;flex:1}
.stat-num{font-family:"Rajdhani",sans-serif;font-size:26px;font-weight:700;line-height:1;color:var(--yellow)}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal h3{font-family:"Rajdhani",sans-serif;font-size:20px;color:var(--red);margin-bottom:10px;letter-spacing:1px}
.modal p{font-size:14px;color:var(--muted);margin-bottom:22px}
.modal-btns{display:flex;gap:10px;justify-content:center}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-danger{background:var(--red);color:white}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:14px;color:var(--white);box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:700;opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media(max-width:600px){
  header{padding:0 14px;height:56px}
  .main{padding:16px 12px 60px}
  .add-card{padding:16px}
  input[type=date],select{width:100%}
  .form-row{flex-direction:column}
  .btn{width:100%;text-align:center}
  .user-name,.header-date{display:none}
  .stats{gap:8px}
  .stat-pill{padding:8px 10px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
  <img class="login-logo" id="login-logo" src="" alt="JR Perfis">
  <div>
    <div class="login-title">JR PERFIS</div>
    <div class="login-sub" style="margin-top:4px">Organizador de Tarefas</div>
  </div>
  <button class="btn-google" id="btn-login">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57C21.36 18.5 22.56 15.68 22.56 12.25z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Entrar com Google
  </button>
  <div class="login-status">
    <div class="dot" id="login-dot"></div>
    <span id="login-msg">Pronto para entrar</span>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <div class="logo">
      <img class="logo-icon" id="app-logo" src="" alt="JR Perfis">
      <div>
        <div class="logo-text">JR PERFIS</div>
        <div class="header-sub">Organizador de Tarefas</div>
      </div>
    </div>
    <div class="header-right">
      <div class="sync-info">
        <div class="dot" id="sync-dot"></div>
        <span id="sync-msg">Sincronizado</span>
      </div>
      <button class="btn-sm" onclick="exportData()">💾 Backup</button>
      <div class="user-chip">
        <span class="user-name" id="user-name"></span>
        <img class="user-photo" id="user-photo" src="" alt="">
        <button class="btn-sm danger" onclick="doLogout()">Sair</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="stats" id="stats-bar"></div>

    <div class="add-card">
      <h2>Nova Tarefa</h2>
      <div class="form-row">
        <input type="text" id="inp-text" placeholder="Descreva a tarefa..." maxlength="200">
      </div>
      <div class="form-row">
        <select id="inp-cat">
          <option value="hoje">📅 Hoje</option>
          <option value="semana">📆 Semana</option>
          <option value="urgente">🔥 Urgente</option>
          <option value="pendente">⏳ Pendente</option>
        </select>
        <select id="inp-prio">
          <option value="alta">🔴 Alta prioridade</option>
          <option value="media" selected>🟡 Média prioridade</option>
          <option value="baixa">🟢 Baixa prioridade</option>
        </select>
      </div>
      <div class="form-row">
        <input type="text" id="inp-solic" placeholder="👤 Solicitante (quem pediu)..." maxlength="60">
      </div>
      <div class="form-row prazo-row">
        <label class="prazo-toggle">
          <span class="toggle-sw">
            <input type="checkbox" id="inp-prazo" onchange="togglePrazo()">
            <span class="toggle-slider"></span>
          </span>
          <span>Definir prazo</span>
        </label>
        <div class="prazo-field" id="prazo-field">
          <label style="font-size:13px;color:var(--muted)">📅 Prazo:</label>
          <input type="date" id="inp-date">
        </div>
      </div>
      <div class="form-row" style="margin-top:4px">
        <button class="btn btn-primary" onclick="addTask()">+ Adicionar Tarefa</button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="task-list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="del-overlay">
  <div class="modal">
    <h3>⚠ Excluir tarefa?</h3>
    <p>Esta ação não pode ser desfeita.</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
                                   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// ── HELPERS
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 2500);
}
function setSyncDot(color, msg) {
  const d = document.getElementById("sync-dot");
  const s = document.getElementById("sync-msg");
  ["green","yellow","red"].forEach(function(c){ d.classList.remove(c); });
  if (color) d.classList.add(color);
  if (s) s.textContent = msg;
}
function setLoginDot(color, msg) {
  const d = document.getElementById("login-dot");
  const s = document.getElementById("login-msg");
  ["green","yellow","red"].forEach(function(c){ d.classList.remove(c); });
  if (color) d.classList.add(color);
  if (s) s.textContent = msg;
}
function todayStr() { return new Date().toISOString().split("T")[0]; }
function fmtDate(d) {
  if (!d) return "";
  var p = d.split("-");
  return p[2] + "/" + p[1];
}
function isOverdue(d) { return d ? d < todayStr() : false; }
function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

// ── AUTH
document.getElementById("btn-login").addEventListener("click", function() {
  setLoginDot("yellow", "Entrando...");
  var provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider).catch(function(e) {
    console.error(e);
    setLoginDot("red", "Erro: " + e.message);
    toast("⚠ Erro ao entrar. Verifique o console.");
  });
});

window.doLogout = function() {
  if (unsub) unsub();
  signOut(auth);
};

onAuthStateChanged(auth, function(user) {
  if (user) {
    uid = user.uid;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    var nm = document.getElementById("user-name");
    var ph = document.getElementById("user-photo");
    if (nm) nm.textContent = (user.displayName || "").split(" ")[0];
    if (ph && user.photoURL) { ph.src = user.photoURL; ph.style.display = "block"; }
    var dt = document.getElementById("today-date");
    // header date
    var hdr = document.querySelector(".header-right");
    if (!document.getElementById("hdr-date")) {
      var sp = document.createElement("div");
      sp.id = "hdr-date";
      sp.className = "header-date";
      sp.textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
      hdr.insertBefore(sp, hdr.firstChild);
    }
    listenTasks();
  } else {
    uid = null;
    tasks = [];
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
    setLoginDot("", "Pronto para entrar");
  }
});

// ── FIRESTORE
function listenTasks() {
  if (unsub) unsub();
  setSyncDot("yellow", "Sincronizando...");
  var q = query(collection(db, "users", uid, "tasks"), orderBy("created","desc"));
  unsub = onSnapshot(q, function(snap) {
    tasks = snap.docs.map(function(d) {
      var data = d.data();
      data.id = d.id;
      if (!data.obs)   data.obs   = "";
      if (!data.solic) data.solic = "";
      return data;
    });
    setSyncDot("green", "Sincronizado");
    render();
  }, function(err) {
    console.error(err);
    setSyncDot("red", "Erro de conexão");
  });
}

function saveTask(t) {
  if (!uid) return;
  setSyncDot("yellow", "Salvando...");
  return setDoc(doc(db, "users", uid, "tasks", String(t.id)), t)
    .catch(function(e){ console.error(e); toast("⚠ Erro ao salvar"); });
}
function removeTask(id) {
  if (!uid) return;
  return deleteDoc(doc(db, "users", uid, "tasks", String(id)))
    .catch(function(e){ console.error(e); toast("⚠ Erro ao excluir"); });
}

// ── FORM
window.togglePrazo = function() {
  var chk   = document.getElementById("inp-prazo").checked;
  var field = document.getElementById("prazo-field");
  if (chk) {
    field.classList.add("show");
    document.getElementById("inp-date").focus();
  } else {
    field.classList.remove("show");
    document.getElementById("inp-date").value = "";
  }
};

window.addTask = function() {
  var text = document.getElementById("inp-text").value.trim();
  if (!text) { toast("⚠ Digite o nome da tarefa!"); return; }
  var prazo = document.getElementById("inp-prazo").checked;
  var t = {
    id:      String(Date.now()),
    text:    text,
    cat:     document.getElementById("inp-cat").value,
    prio:    document.getElementById("inp-prio").value,
    date:    prazo ? document.getElementById("inp-date").value : "",
    solic:   document.getElementById("inp-solic").value.trim(),
    obs:     "",
    done:    false,
    created: new Date().toISOString()
  };
  document.getElementById("inp-text").value  = "";
  document.getElementById("inp-solic").value = "";
  document.getElementById("inp-date").value  = "";
  document.getElementById("inp-prazo").checked = false;
  document.getElementById("prazo-field").classList.remove("show");
  saveTask(t);
  toast("✓ Tarefa adicionada!");
};

document.getElementById("inp-text").addEventListener("keydown", function(e) {
  if (e.key === "Enter") window.addTask();
});

// ── ACTIONS
window.toggleDone = function(id) {
  var t = tasks.find(function(x){ return x.id === id; });
  if (!t) return;
  t.done = !t.done;
  saveTask(t);
  toast(t.done ? "✅ Concluída!" : "↩ Reaberta");
};

window.changeCat = function(id, cat) {
  var t = tasks.find(function(x){ return x.id === id; });
  if (!t || t.cat === cat) return;
  t.cat = cat;
  saveTask(t);
  toast("✓ Movida para " + (CATS[cat] || cat));
  closeDropdowns();
};

window.changePrio = function(id, prio) {
  var t = tasks.find(function(x){ return x.id === id; });
  if (!t || t.prio === prio) return;
  t.prio = prio;
  saveTask(t);
  toast("✓ Prioridade: " + prio);
  closeDropdowns();
};

window.toggleDD = function(e, menuId) {
  e.stopPropagation();
  var menu = document.getElementById(menuId);
  if (!menu) return;
  var wasOpen = menu.classList.contains("open");
  closeDropdowns();
  if (!wasOpen) menu.classList.add("open");
};

function closeDropdowns() {
  document.querySelectorAll(".dd-menu.open").forEach(function(m){ m.classList.remove("open"); });
}
document.addEventListener("click", closeDropdowns);

window.openObsEdit = function(id) {
  var chip   = document.getElementById("obs-chip-" + id);
  var addBtn = document.getElementById("obs-add-" + id);
  var editor = document.getElementById("obs-ed-" + id);
  if (chip)   chip.style.display   = "none";
  if (addBtn) addBtn.style.display = "none";
  if (editor) {
    editor.classList.add("open");
    var ta = document.getElementById("obs-ta-" + id);
    if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
  }
};

window.closeObsEdit = function(id) {
  var editor = document.getElementById("obs-ed-" + id);
  if (editor) editor.classList.remove("open");
  var t = tasks.find(function(x){ return x.id === id; });
  if (!t) return;
  var hasObs = t.obs && t.obs.trim().length > 0;
  var chip   = document.getElementById("obs-chip-" + id);
  var addBtn = document.getElementById("obs-add-" + id);
  var chipTx = document.getElementById("obs-tx-" + id);
  if (hasObs) {
    if (chip)   { if (chipTx) chipTx.textContent = t.obs; chip.style.display = ""; }
    if (addBtn) addBtn.style.display = "none";
  } else {
    if (chip)   chip.style.display   = "none";
    if (addBtn) addBtn.style.display = "";
  }
};

window.saveObs = function(id) {
  var t = tasks.find(function(x){ return x.id === id; });
  if (!t) return;
  var ta = document.getElementById("obs-ta-" + id);
  t.obs = ta ? ta.value : "";
  clearTimeout(obsTimers[id]);
  obsTimers[id] = setTimeout(function() {
    saveTask(t).then(function() {
      var sv = document.getElementById("obs-sv-" + id);
      if (sv) { sv.classList.add("show"); setTimeout(function(){ sv.classList.remove("show"); }, 1800); }
    });
  }, 800);
};

window.askDelete = function(id) {
  deleteId = id;
  document.getElementById("del-overlay").classList.add("open");
};
window.closeModal = function() {
  deleteId = null;
  document.getElementById("del-overlay").classList.remove("open");
};
window.confirmDelete = function() {
  if (!deleteId) return;
  removeTask(deleteId);
  closeModal();
  toast("🗑 Excluída");
};
document.getElementById("del-overlay").addEventListener("click", function(e) {

});

// ── EXPORT
window.exportData = function() {
  if (!tasks.length) { toast("⚠ Nenhuma tarefa!"); return; }
  var json = JSON.stringify({ versao:"1.0", exportado:new Date().toLocaleString("pt-BR"), tarefas:tasks }, null, 2);
  var blob = new Blob([json], { type:"application/json" });
  var url  = URL.createObjectURL(blob);
  var now  = new Date();
  var nome = "jrperfis-" + now.getFullYear() + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0") + ".json";
  var a = document.createElement("a");
  a.href = url; a.download = nome; a.click();
  URL.revokeObjectURL(url);
  toast("💾 Backup exportado!");
};

// ── RENDER
function renderStats() {
  var total   = tasks.length;
  var done    = tasks.filter(function(t){ return t.done; }).length;
  var urgente = tasks.filter(function(t){ return t.cat === "urgente" && !t.done; }).length;
  var hoje    = tasks.filter(function(t){ return t.cat === "hoje" && !t.done; }).length;
  document.getElementById("stats-bar").innerHTML =
    '<div class="stat-pill"><div class="stat-num">' + total + '</div><div class="stat-label">Total</div></div>' +
    '<div class="stat-pill"><div class="stat-num" style="color:var(--green)">' + done + '</div><div class="stat-label">Concluídas</div></div>' +
    '<div class="stat-pill"><div class="stat-num" style="color:var(--blue)">' + hoje + '</div><div class="stat-label">Hoje</div></div>' +
    '<div class="stat-pill"><div class="stat-num" style="color:var(--red)">' + urgente + '</div><div class="stat-label">Urgentes</div></div>';
}

function renderTabs() {
  var bar = document.getElementById("tabs");
  bar.innerHTML = "";
  TABS.forEach(function(tab) {
    var count;
    if (tab.id === "todas")         count = tasks.filter(function(t){ return !t.done; }).length;
    else if (tab.id === "concluidas") count = tasks.filter(function(t){ return t.done; }).length;
    else                            count = tasks.filter(function(t){ return t.cat === tab.id && !t.done; }).length;
    var btn = document.createElement("button");
    btn.className = "tab" + (currentTab === tab.id ? " active" : "");
    btn.innerHTML = tab.label + ' <span class="badge">' + count + "</span>";
    btn.addEventListener("click", function() { currentTab = tab.id; render(); });
    bar.appendChild(btn);
  });
}

function renderList() {
  var list = document.getElementById("task-list");
  list.innerHTML = "";
  var filtered;
  if (currentTab === "todas")          filtered = tasks.filter(function(t){ return !t.done; });
  else if (currentTab === "concluidas") filtered = tasks.filter(function(t){ return t.done; });
  else                                 filtered = tasks.filter(function(t){ return t.cat === currentTab && !t.done; });

  var prioOrd = { alta:0, media:1, baixa:2 };
  filtered.sort(function(a,b){ return (prioOrd[a.prio]||1) - (prioOrd[b.prio]||1); });

  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>Nenhuma tarefa aqui ainda.</div>';
    return;
  }

  if (currentTab === "todas") {
    var groups = { urgente:[], hoje:[], semana:[], pendente:[] };
    filtered.forEach(function(t){ if (groups[t.cat]) groups[t.cat].push(t); });
    ["urgente","hoje","semana","pendente"].forEach(function(cat) {
      if (!groups[cat].length) return;
      var sec = document.createElement("div");
      sec.className = "section-title";
      sec.textContent = CATS[cat] || cat;
      list.appendChild(sec);
      var ul = document.createElement("div");
      ul.className = "tasks-list";
      groups[cat].forEach(function(t){ ul.appendChild(makeCard(t)); });
      list.appendChild(ul);
    });
  } else {
    var ul = document.createElement("div");
    ul.className = "tasks-list";
    filtered.forEach(function(t){ ul.appendChild(makeCard(t)); });
    list.appendChild(ul);
  }
}

function makeCard(t) {
  var id      = t.id;
  var overdue = isOverdue(t.date) && !t.done;
  var hasObs  = t.obs && t.obs.trim().length > 0;

  var card = document.createElement("div");
  card.className = "task-card" + (t.done ? " done" : "");
  card.dataset.priority = t.prio;

  // ── date tag
  var dateHtml = "";
  if (t.date) {
    var cls = overdue ? "task-date overdue" : "task-date";
    var ico = overdue ? "⚠" : "📅";
    var sfx = overdue ? " · vencida" : "";
    dateHtml = '<span class="' + cls + '">' + ico + " Prazo: " + fmtDate(t.date) + sfx + "</span>";
  }

  // ── solic tag
  var solicHtml = t.solic ? '<span class="tag tag-solic">👤 ' + esc(t.solic) + "</span>" : "";

  // ── obs html
  var obsChipHtml = "";
  if (hasObs) {
    obsChipHtml =
      '<div id="obs-chip-' + id + '" class="obs-chip" onclick="openObsEdit('' + id + '')">' +
      '<span class="obs-chip-icon">✎</span>' +
      '<div><div class="obs-chip-label">Observação</div>' +
      '<span class="obs-chip-text" id="obs-tx-' + id + '">' + esc(t.obs) + "</span>" +
      '<span class="obs-chip-hint">clique para editar</span></div></div>';
  } else {
    obsChipHtml = '<div id="obs-chip-' + id + '" style="display:none"></div>';
  }
  var obsAddHtml = hasObs
    ? '<div id="obs-add-' + id + '" style="display:none"></div>'
    : '<div id="obs-add-' + id + '"><button class="obs-add-btn" onclick="openObsEdit('' + id + '')">✎ Adicionar observação / andamento</button></div>';

  card.innerHTML =
    '<div class="task-top">' +
      '<div class="chk ' + (t.done ? "checked" : "") + '" onclick="toggleDone('' + id + '')" title="' + (t.done ? "Desmarcar" : "Concluir") + '"></div>' +
      '<div class="task-body">' +
        '<div class="task-title">' + esc(t.text) + "</div>" +
        '<div class="task-meta">' +

          // categoria
          '<div class="dd-wrap">' +
            '<span class="tag tag-cat dd-tag" onclick="toggleDD(event,'cat-dd-' + id + '')">' + (CATS[t.cat] || t.cat) + "</span>" +
            '<div class="dd-menu" id="cat-dd-' + id + '">' +
              '<button class="dd-item cat ' + (t.cat==="hoje"?"cur":"") + '" onclick="changeCat('' + id + '','hoje')">📅 Hoje</button>' +
              '<button class="dd-item cat ' + (t.cat==="semana"?"cur":"") + '" onclick="changeCat('' + id + '','semana')">📆 Semana</button>' +
              '<button class="dd-item cat ' + (t.cat==="urgente"?"cur":"") + '" onclick="changeCat('' + id + '','urgente')">🔥 Urgente</button>' +
              '<button class="dd-item cat ' + (t.cat==="pendente"?"cur":"") + '" onclick="changeCat('' + id + '','pendente')">⏳ Pendente</button>' +
            "</div></div>" +

          // prioridade
          '<div class="dd-wrap">' +
            '<span class="tag tag-' + t.prio + ' dd-tag" onclick="toggleDD(event,'prio-dd-' + id + '')">' + t.prio.charAt(0).toUpperCase() + t.prio.slice(1) + "</span>" +
            '<div class="dd-menu" id="prio-dd-' + id + '">' +
              '<button class="dd-item alta ' + (t.prio==="alta"?"cur":"") + '" onclick="changePrio('' + id + '','alta')">🔴 Alta</button>' +
              '<button class="dd-item media ' + (t.prio==="media"?"cur":"") + '" onclick="changePrio('' + id + '','media')">🟡 Média</button>' +
              '<button class="dd-item baixa ' + (t.prio==="baixa"?"cur":"") + '" onclick="changePrio('' + id + '','baixa')">🟢 Baixa</button>' +
            "</div></div>" +

          dateHtml + solicHtml +
        "</div>" +
      "</div>" +
      '<div class="task-actions">' +
        '<button class="act-btn del" onclick="askDelete('' + id + '')" title="Excluir">🗑</button>' +
      "</div>" +
    "</div>" +
    '<div class="obs-section">' +
      obsChipHtml + obsAddHtml +
      '<div class="obs-editor" id="obs-ed-' + id + '">' +
        '<div class="obs-editor-label">✎ Observações / Andamento</div>' +
        '<textarea class="obs-ta" id="obs-ta-' + id + '" placeholder="Descreva o andamento..." oninput="saveObs('' + id + '')">' + esc(t.obs || "") + "</textarea>" +
        '<div class="obs-footer">' +
          '<span class="obs-saved" id="obs-sv-' + id + '">✓ Salvo</span>' +
          '<button class="obs-close" onclick="closeObsEdit('' + id + '')">Fechar ✕</button>' +
        "</div>" +
      "</div>" +
    "</div>";

  return card;
}

function render() { renderStats(); renderTabs(); renderList(); }

</script>
</body>
</html>
